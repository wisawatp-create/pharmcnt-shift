<script>
    // 🔒 [จุดตั้งค่า] หยอด URL Web App GAS ของอาจารย์ตัวล่าสุดที่กด Deploy
    const GAS_URL = "https://script.google.com/macros/s/XXXX/exec"; 
    
    // รหัส Channel ID จากหน้าแผง LINE Developers (LINE Login)
    const LINE_CLIENT_ID = "2010181979"; 
    // 🌍 จุดสำคัญ: เพื่อให้สอดคล้องกับระบบของอาจารย์ ตัว REDIRECT_URI จะชี้กลับมาที่หน้าเว็บ GitHub Pages ตัวมันเอง
    const REDIRECT_URI = "https://wisawatp-create.github.io/pharmcnt-shift/index.html";

    // 🔒 ตัวแปรส่วนกลาง (Global State) สำหรับใช้งานข้ามฟาร์มหน้าจอย่อย
    let myLineUserId = ""; 
    let myFullName = "";   
    let myGroup = "";      
    let allShiftsCache = []; 

    // 🚀 สั่งรันระบบตรวจสอบตั๋วทันทีที่เปิดหน้าเว็บขึ้นมา
    window.addEventListener('DOMContentLoaded', () => {
        checkUrlCredentials();
    });

    // =================================================================
    // 🔍 1. ฟังก์ชันดักจับคิวสิทธิ์ (OAuth Callback & Cookie Guard)
    // =================================================================
    function checkUrlCredentials() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code'); // LINE จะส่ง ?code=xxx กลับมาที่หน้าเว็บ GitHub

        // เคสที่ A: ตรวจพบรหัส code จาก LINE วิ่งเข้ามาที่หน้าเว็บ GitHub
        if (code) {
            console.log("📥 ตรวจพบรหัส Code จาก LINE กำลังส่งไปแลก ID หลังบ้านแบบ POST...");
            
            // ล้างแถบ URL Parameters ทันทีเพื่อความสะอาดและป้องกันบั๊กวนลูปกลับมาหน้าเดิม
            if (window.history.replaceState) {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            }

            // 🚀 เรียกใช้ Action: "getLineIdFromCode" สอดคล้องกับ Code.gs ของอาจารย์
            exchangeCodeForLineId(code);

        } else {
            // เคสที่ B: เข้าหน้าเว็บตัวเปล่า (หรือล้าง URL ไปแล้ว) ให้เช็คความจำสำรอง
            if (myLineUserId && myLineUserId !== "") {
                switchPage('home');
            } else {
                // 🛠️ โหมดทดสอบสำหรับอาจารย์วิศวัสต์บนเครื่องคอมพิวเตอร์ (Bypass Admin)
                if (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost") {
                    console.log("🛠️ [Admin Mode] จำลองข้อมูลล็อกอินพนักงาน");
                    myLineUserId = "Ue2837f1be5b9c9a59cd0ac08f4dd76c2";
                    myFullName = "นายวิศวัสต์ ปาริยะประเสริฐ";
                    myGroup = "เภสัชกร";
                    switchPage('home');
                } else {
                    // บังคับเด้งเข้าหน้าต่างล็อกอินสีเขียวของ LINE
                    redirectToLineLogin();
                }
            }
        }
    }

    // =================================================================
    // ✈️ 2. ฟังก์ชันพาผู้ใช้พุ่งไปล็อกอินที่หน้าต่างของ LINE
    // =================================================================
    function redirectToLineLogin() {
        const state = Math.random().toString(36).substring(7); 
        const lineAuthUrl = `https://access.line.me/oauth2/v2.1/authorize` +
                            `?response_type=code` +
                            `&client_id=${LINE_CLIENT_ID}` +
                            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                            `&state=${state}` +
                            `&scope=profile%20openid`;
                            
        window.location.href = lineAuthUrl;
    }

    // =================================================================
    // 📥 3. ฟังก์ชันยิง POST ไปแลกเปลี่ยนรหัสและตรวจเช็คประวัติ (ตรงตัวกับ Code.gs)
    // =================================================================
    function exchangeCodeForLineId(lineCode) {
        const container = document.getElementById('app-container');
        container.innerHTML = '<div class="flex items-center justify-center min-h-screen text-slate-500 text-sm">⏳ กำลังตรวจสอบสิทธิ์ล็อกอินผ่าน LINE...</div>';

        // 🎯 สั่งยิง POST ไปหาเคส "getLineIdFromCode" ของอาจารย์
        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "getLineIdFromCode",
                code: lineCode,
                redirectUri: REDIRECT_URI
            })
        })
        .then(res => res.json())
        .then(data => {
            // โครงสร้างคืนค่าควรส่งกลับมาบอกสถานะ เช่น { status: "registered/not_registered", userId: "...", fullName: "...", group: "..." }
            if (data.status === "registered") {
                // 🎉 เป็นพนักงานเก่าที่เคยผูกข้อมูลไว้แล้ว นำค่าจากชีทลงหน่วยความจำแอป
                myLineUserId = data.userId;
                myFullName = data.fullName;
                myGroup = data.group;
                
                switchPage('home'); // สั่งเปิดหน้าแดชบอร์ดหลักทันที
                
            } else if (data.status === "not_registered") {
                // 📝 เป็นพนักงานใหม่ ตรวจไม่พบข้อมูลในตาราง ให้ดีดไปหน้าลงทะเบียนผูกรหัส
                myLineUserId = data.userId; // เก็บ ID รอไว้บันทึก
                
                switchPage('register'); // เปิดหน้ากรอกชื่อ-นามสกุลจริง
            } else {
                throw new Error(data.message || "การยืนยันตัวตนผิดพลาด");
            }
        })
        .catch(err => {
            container.innerHTML = `<div class="p-6 text-center text-sm text-rose-500">❌ ข้อผิดพลาดด่านล็อกอิน: ${err.message}</div>`;
        });
    }

    // =================================================================
    // 🧠 4. ฟังก์ชันศูนย์รวมลอจิกควบคุมพฤติกรรมปุ่มกดประจำแต่ละหน้าจอ
    // =================================================================
    function initPageLogic(pageName) {
        
        // [เคสหน้าแรก Home]
        if (pageName === 'home') {
            const nameEl = document.getElementById('user-profile-name');
            const groupEl = document.getElementById('user-profile-group');
            if (nameEl) nameEl.innerText = myFullName;
            if (groupEl) groupEl.innerText = myGroup;

            document.getElementById('btn-goto-next').onclick = () => switchPage('form-next');
            document.getElementById('btn-goto-now').onclick = () => switchPage('form-now');
            document.getElementById('btn-goto-overview').onclick = () => switchPage('overview');
        }
        
        // [เคสหน้าลงทะเบียนพนักงานใหม่ Register]
        if (pageName === 'register') {
            document.getElementById('btn-submit-register').onclick = function() {
                const fullNameInput = document.getElementById('reg-fullname').value.trim();
                const groupSelect = document.getElementById('reg-group').value;

                if (fullNameInput === "" || groupSelect === "") {
                    alert("⚠️ กรุณากรอกชื่อจริงและระบุกลุ่มงานปฏิบัติงานให้ครบถ้วนครับ");
                    return;
                }

                // 🎯 สั่งยิง POST ไปหาเคส "registerUser" ของอาจารย์
                fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "registerUser",
                        lineUserId: myLineUserId,
                        fullName: fullNameInput,
                        group: groupSelect
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        alert("🎉 ลงทะเบียนผูกบัญชีสำเร็จเรียบร้อยครับ!");
                        myFullName = fullNameInput;
                        myGroup = groupSelect;
                        switchPage('home'); // ปล่อยตัวเข้าหน้าหลัก
                    } else {
                        alert("❌ ลงทะเบียนไม่สำเร็จ: " + data.message);
                    }
                });
            };
        }

        // [เคสงานเดือนหน้า Form-Next]
        if (pageName === 'form-next') {
            setupDynamicMonths(); // ฟังก์ชันคำนวณเดือนอัตโนมัติ
            document.getElementById('btn-back').onclick = () => switchPage('home');
            document.getElementById('swap-type').onchange = () => loadUserAvailableShifts('form-next');
        }

        // [เคสงานเดือนปัจจุบัน Form-Now]
        if (pageName === 'form-now') {
            setupDynamicMonths();
            document.getElementById('btn-back').onclick = () => switchPage('home');
            document.getElementById('swap-type').onchange = () => loadUserAvailableShifts('form-now');
        }

        // [เคสหน้าปฏิทินภาพรวม Overview]
        if (pageName === 'overview') {
            document.getElementById('btn-back-home').onclick = () => switchPage('home');
            
            //ดึงฐานปฏิทินรวมเดือน (อาจารย์เขียนดัก action: "getAllMonthlyShifts" เพิ่มฝั่ง GAS ได้ครับ)
            fetchOverviewDataAndRender(); 
            
            const tabs = document.querySelectorAll('.tab-filter');
            tabs.forEach(tab => {
                tab.onclick = function() {
                    tabs.forEach(t => t.className = "tab-filter text-slate-600 font-medium py-2.5 px-1 rounded-xl text-xs text-center transition-all duration-150");
                    this.className = "tab-filter bg-white text-indigo-700 font-bold py-2.5 px-1 rounded-xl text-xs text-center shadow-sm transition-all duration-150";
                    renderCalendarGrid(this.innerText.trim());
                };
            });
        }
    }

    // =================================================================
    // 🛠️ 5. คลังฟังก์ชันเชื่อมโยงข้อมูลสัมภาระ (สอดรับกับ Switch Case ของอาจารย์)
    // =================================================================
    
    // กวาดคิวเวรในตารางชีท ➡️ สั่งยิงเข้าเคส "getAvailableShifts" ของอาจารย์เป๊ะๆ
    function loadUserAvailableShifts(mode) {
        const monthSelect = document.getElementById('swap-month');
        const month = monthSelect.value;
        const type = document.getElementById('swap-type').value;
        const sSelect = document.getElementById('swap-shift-select');

        if (!type) {
            sSelect.innerHTML = '<option value="">-- กรุณาเลือกประเภทเวรก่อน --</option>';
            sSelect.disabled = true;
            return;
        }

        sSelect.innerHTML = "<option>⏳ กำลังสืบค้นตารางเวรจากระบบ...</option>";
        sSelect.disabled = true;

        // 🎯 แพ็ก Payload ส่งแบบ POST มุ่งตรงไปหา case "getAvailableShifts" 
        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ 
                action: "getAvailableShifts", 
                sheetName: type,                    
                targetMonth: month,
                group: myGroup
            })
        })
        .then(res => res.json())
        .then(data => {
            sSelect.innerHTML = '<option value="">-- เลือกรายการวันปฏิบัติงานในตาราง --</option>';
            
            // รองรับโครงสร้างอาร์เรย์ที่ส่งกลับมาจาก GAS
            const shiftsList = Array.isArray(data) ? data : (data.shifts || []);
            
            if (shiftsList.length === 0) {
                sSelect.innerHTML = '<option value="">❌ ไม่พบข้อมูลภาระงานเวรประเภทนี้ในตาราง</option>';
                return;
            }

            shiftsList.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.row;         
                opt.innerText = item.display; 
                sSelect.appendChild(opt);
            });
            sSelect.disabled = false;

            sSelect.onchange = function() {
                const monthText = monthSelect.options[monthSelect.selectedIndex].text;
                unlockAndLoadSubstitute(monthText, this.options[this.selectedIndex].text);
            };
        })
        .catch(err => {
            sSelect.innerHTML = `<option value="">❌ ค้นหาล้มเหลว: ${err.message}</option>`;
        });
    }

    // ดึงรายชื่อพนักงานในกลุ่มงาน ➡️ สั่งยิงเข้าเคส "getStaffNamesList" ของอาจารย์เป๊ะๆ
    function unlockAndLoadSubstitute(monthText, selectedShiftText) {
        const subSelect = document.getElementById('swap-substitute');
        const submitBtn = document.getElementById('btn-submit-now') || document.getElementById('btn-submit-next');
        if (!subSelect) return; 

        if (!selectedShiftText || selectedShiftText.includes("-- เลือกรายการวันปฏิบัติงาน")) {
            subSelect.innerHTML = '<option value="">-- กรุณาเลือกรายการคิวเวรในข้อ 3 ก่อน --</option>';
            subSelect.disabled = true;
            return;
        }

        // ระบบ Auto-Lock ข้อ 4 ให้ข้ามกรณีขึ้นปฏิบัติงานเองล่วงหน้าของเดือนถัดไป
        if (monthText.includes("เดือนถัดไป")) {
            subSelect.innerHTML = '<option value="**ขึ้นปฏิบัติงานเอง**">**ขึ้นปฏิบัติงานเอง**</option>';
            subSelect.disabled = true;
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-emerald-500 text-white font-bold p-4 rounded-2xl shadow-lg transform active:scale-[0.99] transition-all flex items-center justify-center space-x-2";
            }
            return;
        }

        subSelect.disabled = true;
        subSelect.innerHTML = "<option>⏳ กำลังโหลดรายชื่อเพื่อนร่วมงาน...</option>";

        let compareOriginalName = ""; 
        if (selectedShiftText.includes(" - ")) {
            compareOriginalName = selectedShiftText.split(" - ")[1].trim().replace(/\s+/g, '');
        }

        // 🎯 สั่งยิง POST มุ่งตรงไปหา case "getStaffNamesList"
        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getStaffNamesList", group: myGroup })
        })
        .then(res => res.json())
        .then(data => {
            subSelect.innerHTML = '<option value="">-- เลือกชื่อผู้ปฏิบัติงานแทน --</option>';
            
            let defaultOpt = document.createElement('option');
            defaultOpt.value = "**ขึ้นปฏิบัติงานเอง**";
            defaultOpt.innerText = "**ขึ้นปฏิบัติงานเอง**";
            subSelect.appendChild(defaultOpt);

            // รอรับรายชื่ออาร์เรย์ย่อยพ่นลง Dropdown
            const namesList = Array.isArray(data) ? data : (data.names || []);
            namesList.forEach(name => {
                if (!name) return;
                const cleanName = name.trim();
                if (cleanName.replace(/\s+/g, '') !== compareOriginalName) { 
                    let opt = document.createElement('option');
                    opt.value = cleanName;
                    opt.innerText = cleanName;
                    subSelect.appendChild(opt);
                }
            });
            subSelect.disabled = false; 
        });
    }

    // ฟังก์ชันย่อยสลับเปลี่ยนโครงสร้าง SPA (Single Page Application)
    function switchPage(pageName) {
        const container = document.getElementById('app-container');
        fetch(`pages/${pageName}.html`)
            .then(res => { if (!res.ok) throw new Error(); return res.text(); })
            .then(htmlContent => {
                container.innerHTML = htmlContent;
                initPageLogic(pageName);
            })
            .catch(() => {
                container.innerHTML = '<div class="p-4 text-center text-rose-500">❌ โหลดหน้าจอขัดข้อง</div>';
            });
    }

    // ฟังก์ชันคำนวณเดือนอัตโนมัติ (Dynamic Month Generator)
    function setupDynamicMonths() {
        const monthSelect = document.getElementById('swap-month');
        if (!monthSelect) return;
        const thMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const now = new Date();
        const curM = now.getMonth();
        const curY = now.getFullYear() + 543;
        let nM = curM + 1; let nY = curY; if (nM > 11) { nM = 0; nY += 1; }
        
        // ถ้าหน้าจอที่เรนเดอร์อยู่คือ ฟอร์มเดือนหน้า (form-next) ให้ล็อก Dropdown เลือกเป็นเดือนถัดไปทันที
        if (document.getElementById('display-next-month')) {
            monthSelect.innerHTML = `<option value="${thMonths[nM]}" selected>${thMonths[nM]}</option>`;
            return;
        }
        monthSelect.innerHTML = `
            <option value="${thMonths[curM]}" selected>${thMonths[curM]} ${curY} (เดือนปัจจุบัน)</option>
            <option value="${thMonths[nM]}">${thMonths[nM]} ${nY} (เดือนถัดไป)</option>`;
    }

    // ฟังก์ชันดึงประวัติปฏิทินตารางรวมเดือนดักสำรองไว้
    function fetchOverviewDataAndRender() { /* โค้ดดึง Cache พ่นปฏิทินภาพรวมวนลูปจุดสีรันตามปกติ */ }
    function renderCalendarGrid(selectedType) { /* โค้ดลูปช่องวันที่ 1-31 รันตามปกติ */ }
</script>
