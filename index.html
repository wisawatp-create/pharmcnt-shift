<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmCNT Web App (LINE OAuth)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4">

    <div id="loading-screen" class="max-w-md mx-auto text-center py-12">
        <p class="text-slate-500">กำลังตรวจสอบสิทธิ์ผ่านระบบ LINE...</p>
    </div>

    <div id="main-app" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow hidden">
        <h2 id="welcome-text" class="text-xl font-bold mb-4">ยินดีต้อนรับ</h2>
        
        <label class="block text-sm font-medium text-slate-700 mb-1">เลือกเดือนปฏิบัติงาน</label>
        <select id="monthSelect" class="w-full p-2 border rounded-xl mb-4 bg-gray-50">
            <option value="พฤษภาคม">พฤษภาคม</option>
            <option value="มิถุนายน">มิถุนายน</option>
        </select>
        
        <label class="block text-sm font-medium text-slate-700 mb-1">เลือกประเภทเวร</label>
        <select id="shiftType" class="w-full p-2 border rounded-xl mb-4 bg-gray-50">
            <option value="ชบด">ชบด</option>
            <option value="บ่ายน้อย">บ่ายน้อย</option>
            <option value="SMC">SMC</option>
        </select>
        
        <button class="w-full bg-green-600 text-white py-2 rounded-xl font-bold">ค้นหาคิวเวร</button>
    </div>

    <script>
        // ⚙️ ตั้งค่าข้อมูลจาก LINE Developers ของอาจารย์
        const CLIENT_ID = "2010181979"; // ไอดี LINE Login
        const REDIRECT_URI = "https://wisawat-cnt.github.io/pharmcnt-shift/index.html"; // หน้าเว็บของอาจารย์
        const GAS_URL = "URL_WEB_APP_GAS_ของอาจารย์";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code'); // ดึงรหัส Authentication Code ที่ LINE ส่งกลับมาให้

            if (!code) {
                // 🔴 ถ้าเปิดมาแล้วไม่มี code แสดงว่ายังไม่ได้ล็อกอิน ให้เด้งไปหน้า LINE Login ทันที
                const state = "random_string_12345"; // สตริงป้องกันการปลอมแปลงคิวงาน
                const lineLoginUrl = `https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=${state}&scope=profile%20openid`;
                window.location.href = lineLoginUrl;
            } else {
                // 🟢 ถ้ามี code แล้ว ส่งรหัสนี้ไปให้ GAS หลังบ้านแปลงเป็น LINE User ID จริง
                exchangeCodeForProfile(code);
            }
        };

        function exchangeCodeForProfile(code) {
            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "getLineIdFromCode",
                    code: code,
                    redirectUri: REDIRECT_URI
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    // ทำงานสำเร็จ! บดบังหน้าโหลด แล้วแสดงหน้าจอแอปหลัก
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    
                    document.getElementById('welcome-text').innerText = `ผู้ใช้งาน: ${res.fullName} (${res.group})`;
                } else {
                    alert("ลงทะเบียนไม่สำเร็จ หรือไม่มีชื่ออยู่ในระบบโรงพยาบาล: " + res.message);
                }
            });
        }
    </script>
</body>
</html>
